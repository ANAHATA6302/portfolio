name: Build revamp (no deploy)

on:
  push:
    branches:
      - Portfolio-revamp
      - portfolio-revamp-*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Compile and bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --continue
