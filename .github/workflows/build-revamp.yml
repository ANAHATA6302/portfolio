name: Build revamp (no deploy)

on:
  push:
    branches:
      - Portfolio-revamp
      - portfolio-revamp-*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Compile and bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --continue

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: composeApp/build/dist/wasmJs/productionExecutable
          retention-days: 3

      - name: Review screenshots
        if: contains(github.event.head_commit.message, '[shots]')
        run: |
          cd design/review
          npm init -y >/dev/null
          npm install playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          (python3 serve.py ../../composeApp/build/dist/wasmJs/productionExecutable >/dev/null 2>&1 &)
          sleep 2
          rm -rf shots && node shots.mjs http://localhost:8080 shots
          rm -rf node_modules package.json package-lock.json

      - name: Commit screenshots
        if: contains(github.event.head_commit.message, '[shots]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add design/review/shots
          git commit -m "Review screenshots for ${GITHUB_SHA::7} [skip ci]" || exit 0
          git push
